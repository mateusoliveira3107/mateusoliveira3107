name: Atualizar Estatísticas do GitHub

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Gerar card de estatísticas
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&custom_title=Status+GitHub+Mateus+Silva+de+Oliveira&show_icons=true&include_all_commits=true&count_private=true&bg_color=181a1b&title_color=ff4655&text_color=ffffff&icon_color=ff4655&ring_color=ff4655&locale=pt-br&border_color=ffffff21
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar card de linguagens
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&langs_count=6&layout=compact&border_color=ffffff21&bg_color=181a1b&title_color=ff4655&text_color=ffffff&locale=pt-br
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Forçar altura do card para 195
        run: |
          sed -i 's/height="165"/height="195"/g' profile/top-langs.svg
          sed -i 's/viewBox="0 0 300 165"/viewBox="0 0 300 195"/g' profile/top-langs.svg

      - name: Salvar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Atualizar estatísticas do GitHub" || exit 0
          git push
